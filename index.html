
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive mobile layout -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Application information -->
    <title>Chlorine Analyzer | IoT Water Testing</title>

    <meta
      name="description"
      content="Smart IoT Chlorine Analyzer for measuring chlorine in water using OT and DPD methods."
    />

    <meta
      name="application-name"
      content="Chlorine Analyzer"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#0866d9" />
    <meta name="color-scheme" content="light" />

    <!-- PWA Manifest -->
    <link
      rel="manifest"
      href="%BASE_URL%manifest.webmanifest"
    />

    <!-- Android icon -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%BASE_URL%icon-192.png"
    />

    <!-- SVG favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%icon.svg"
    />

    <!-- Apple home-screen icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%apple-touch-icon.png"
    />

    <!-- Android app settings -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <!-- iPhone app settings -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Chlorine Analyzer"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
  </head>

  <body>
    <div id="root"></div>

    <!-- React application -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
